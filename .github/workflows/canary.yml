name: canary

# Nightly liveness check of each provider against the real sites. A broken
# provider is the *normal* operating state, not an incident — so this opens (and
# de-duplicates) a tracking issue rather than failing loudly, and publishes a
# machine-readable status the client can read to pre-deprioritise dead providers.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [anizone, anikoto, hianime]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Probe ${{ matrix.provider }}
        id: probe
        # Reports without failing the job. One provider dying is the normal
        # operating state here, and a red run for it left the providers badge
        # permanently red over an expected casualty — which teaches everyone
        # to ignore the badge, including on a run that means something. The
        # tracking issue below is the alert; `aggregate` is the gate.
        continue-on-error: true
        run: uv run python scripts/canary.py --provider ${{ matrix.provider }}
             --output provider-status-${{ matrix.provider }}.json
      - name: Upload status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: provider-status-${{ matrix.provider }}
          path: provider-status-${{ matrix.provider }}.json
      - name: Open / update tracking issue on failure
        if: steps.probe.outcome == 'failure'
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVIDER: ${{ matrix.provider }}
        with:
          filename: .github/BROKEN_PROVIDER.md
          update_existing: true # dedupe: reuse the open issue instead of spamming

  publish-status:
    # Aggregate status for all providers into one artifact the client can fetch,
    # and the one job whose result the badge reflects. It fails only when *no*
    # provider can play anything, which is the question a user actually has.
    runs-on: ubuntu-latest
    needs: probe
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Collect the probe results
        uses: actions/download-artifact@v7
        with:
          pattern: provider-status-*
          path: probe-results
      # Merging what the matrix already found, rather than probing every site a
      # second time: that doubled the nightly traffic we send these providers,
      # and let a flake in the second pass contradict the run that reported.
      - name: Aggregate, and fail only on a total outage
        run: uv run python scripts/canary.py --merge "probe-results/**/*.json"
             --require-any --output provider-status.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: provider-status
          path: provider-status.json
