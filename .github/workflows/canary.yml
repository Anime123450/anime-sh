name: canary

# Nightly liveness check of each provider against the real sites. A broken
# provider is the *normal* operating state, not an incident — so this opens (and
# de-duplicates) a tracking issue rather than failing loudly, and publishes a
# machine-readable status the client can read to pre-deprioritise dead providers.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [anizone, anikoto]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Probe ${{ matrix.provider }}
        id: probe
        run: uv run python scripts/canary.py --provider ${{ matrix.provider }}
             --output provider-status-${{ matrix.provider }}.json
      - name: Upload status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: provider-status-${{ matrix.provider }}
          path: provider-status-${{ matrix.provider }}.json
      - name: Open / update tracking issue on failure
        if: failure()
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVIDER: ${{ matrix.provider }}
        with:
          filename: .github/BROKEN_PROVIDER.md
          update_existing: true # dedupe: reuse the open issue instead of spamming

  publish-status:
    # Aggregate status for all providers into one artifact the client can fetch.
    runs-on: ubuntu-latest
    needs: probe
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run python scripts/canary.py --output provider-status.json || true
      - uses: actions/upload-artifact@v7
        with:
          name: provider-status
          path: provider-status.json
