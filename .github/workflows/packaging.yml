name: packaging

# The Linux/macOS packaging is written on a Windows machine, where neither
# `makepkg` nor `brew` exists. This is the only place either is actually built,
# so it runs on every change to them and weekly — the failure mode for a
# distro package is that nobody notices until a stranger tries to install it.

on:
  push:
    paths:
      - "packaging/aur/**"
      - "scripts/aur_pkgbuild.py"
      - ".github/workflows/packaging.yml"
  pull_request:
    paths:
      - "packaging/aur/**"
      - "scripts/aur_pkgbuild.py"
      - ".github/workflows/packaging.yml"
  schedule:
    - cron: "0 6 * * 1" # Mondays
  workflow_dispatch: {}

jobs:
  aur:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7

      - name: Install build tooling
        run: pacman -Syu --noconfirm git sudo

      - name: makepkg refuses to run as root, so build as a normal user
        run: |
          useradd -m builder
          chown -R builder packaging/aur
          chmod -R a+rX .
          # --syncdeps shells out to pacman through sudo, which has no terminal
          # to ask for a password on.
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder

      - name: Check .SRCINFO matches the PKGBUILD
        # A stale .SRCINFO is what the AUR actually serves to users, so a
        # mismatch is a package that lies about its own version.
        run: |
          cd packaging/aur
          su builder -c "makepkg --printsrcinfo" > /tmp/generated.SRCINFO
          diff -u .SRCINFO /tmp/generated.SRCINFO || {
            echo "::error::.SRCINFO is stale - regenerate with scripts/aur_pkgbuild.py"
            exit 1
          }

      - name: Build the package
        run: |
          cd packaging/aur
          su builder -c "makepkg --syncdeps --noconfirm --nocheck"

      - name: Install it and check it runs
        run: |
          cd packaging/aur
          pacman -U --noconfirm anime-sh-*.pkg.tar.zst
          anime --version
          # doctor reports missing optional tools rather than failing, so this
          # proves the entry point and every required import resolve.
          anime doctor || true
