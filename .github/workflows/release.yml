name: release

# Build, publish to PyPI, and cut the matching GitHub Release on a version tag.
# PyPI upload uses trusted publishing (OIDC) — no API tokens stored in the repo.
# Configure the publisher once at
# https://pypi.org/manage/project/anime-sh/settings/publishing/
#
# The GitHub Release step exists because for 39 versions it did not: PyPI moved
# from 0.2.1 to 0.2.40 while this repo's Releases page still showed 0.2.1, so
# anyone judging the project by GitHub saw one abandoned nine months ago.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

# GitHub delivered one tag push as two identical events on v0.2.54 — same sha,
# same second, two run ids. Both runs published, racing each other into PyPI, and
# the second then lost the GitHub Release step to "a release with the same tag
# name already exists", turning a release that had worked perfectly into a red X.
# Queueing on the tag makes a duplicate wait rather than race, and the release
# step below is idempotent so the one that waits ends up a no-op.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: The tag, pyproject and changelog must agree
        # A tag that disagrees with pyproject publishes a version nobody can
        # trace back, and one with no changelog section publishes empty notes.
        # Both are cheap to check and expensive to undo after upload.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj=$(uv run python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$tag" != "$proj" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $proj"
            exit 1
          fi
          python scripts/changelog_section.py "$tag" > /dev/null

      - name: Run the full test suite + contracts
        run: |
          uv sync --extra dev --extra tui
          uv run pytest -q
          uv run lint-imports

      - name: Build sdist + wheel
        run: uv build

      - name: Extract the release notes from CHANGELOG.md
        run: python scripts/changelog_section.py "${GITHUB_REF_NAME#v}" > RELEASE_NOTES.md

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md


  bundle-windows:
    # The standalone .exe: anime-sh with Python and every dependency inside it,
    # for people who have no Python and should not have to care. This is what
    # winget and scoop point at, so it has to exist for every tagged version at
    # a stable URL.
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build the standalone executable
        shell: bash
        run: |
          set -euo pipefail
          uv run --with pyinstaller python -m PyInstaller --onefile --name anime --console             --collect-all textual --collect-all textual_image --collect-all rich             --collect-all typer --collect-all curl_cffi --collect-all pydantic             --collect-all aiosqlite --collect-all platformdirs             --collect-submodules anime_sh --collect-data anime_sh             --copy-metadata anime-sh             --distpath dist/bundle --workpath build/pyi --specpath build/pyi             --noconfirm packaging/launcher.py

      - name: The bundle must actually work
        shell: bash
        # A bundle that builds is not a bundle that works. Providers and
        # resolvers are entry points, entry points live in the package metadata,
        # and a bundle without it runs perfectly while reporting version
        # 0.0.0+unknown and "providers: none installed" — an app that cannot play
        # anything, shipped green.
        #
        # Asserts the property, not the flag. `--copy-metadata anime-sh` is what
        # historically guaranteed it, but PyInstaller 6 collects the metadata
        # anyway (verified: a build without the flag still carries the dist-info
        # and still lists both providers). The flag stays because it is free and
        # explicit; this check stays because it is the thing that would actually
        # notice if that ever stopped being true.
        run: |
          set -euo pipefail
          version=$(./dist/bundle/anime.exe --version)
          echo "bundle reports: $version"
          expected="anime-sh ${GITHUB_REF_NAME#v}"
          if [ "$version" != "$expected" ]; then
            echo "::error::bundle reports '$version', expected '$expected' — metadata did not make it in"
            exit 1
          fi
          ./dist/bundle/anime.exe providers ls --json > providers.json
          cat providers.json
          for plugin in anikoto anizone; do
            if ! grep -q "\"name\": \"$plugin\"" providers.json; then
              echo "::error::the bundle is missing provider $plugin — entry-point metadata did not make it in"
              exit 1
            fi
          done
          echo "providers present in the bundle: anikoto, anizone"

      - name: Checksum, under the name the release will publish it as
        shell: bash
        # scoop's excavator reads this file to learn the hash of a new version,
        # and it looks inside it for the *published* filename. Hashing
        # `anime.exe` here and renaming the binary later, at upload time, meant
        # the file said `anime.exe` while the excavator searched it for
        # `anime-sh-<version>-windows-x64.exe`, never matched, and quietly fell
        # back to downloading the whole 21 MB executable to hash for itself. So
        # the checksum we published was never the one anything checked against.
        # Renaming before hashing makes the file and the name inside it agree.
        run: |
          set -euo pipefail
          cd dist/bundle
          asset="anime-sh-${GITHUB_REF_NAME#v}-windows-x64.exe"
          mv anime.exe "$asset"
          sha256sum "$asset" | tee "$asset.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-windows
          path: dist/bundle/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A version can only be uploaded to PyPI once, so a duplicate event or
          # a re-run has nothing useful to do and should not fail the release for
          # it. This says "already there" rather than erroring; it cannot mask a
          # real problem, because a *different* build of the same version is
          # rejected by PyPI either way.
          skip-existing: true

  github-release:
    # Runs after PyPI so the release page never advertises a version you cannot
    # yet `uv tool install`.
    needs: [publish, bundle-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: bundle-windows
          path: dist/bundle/
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Idempotent on purpose: a re-run, or a duplicate event from GitHub,
          # must not fail a release that has already published correctly.
          # Creating and filling in are separate steps so an attempt interrupted
          # between them — release made, assets not yet attached — still finishes.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; updating it instead."
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "anime-sh ${GITHUB_REF_NAME#v}" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "anime-sh ${GITHUB_REF_NAME#v}" \
              --notes-file RELEASE_NOTES.md
          fi
          # --clobber so a re-run replaces the artifacts rather than erroring on
          # ones that are already attached.
          # The bundle job already named the binary for its version, because
          # the checksum file beside it has to record that same name. The winget
          # and scoop manifests pin an exact URL and hash, so neither filename
          # may change shape between releases.
          asset="anime-sh-${GITHUB_REF_NAME#v}-windows-x64.exe"
          gh release upload "$GITHUB_REF_NAME" \
            dist/*.whl dist/*.tar.gz \
            "dist/bundle/$asset" "dist/bundle/$asset.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

  chocolatey:
    # Build the chocolatey package and prove it installs, on a runner that has
    # chocolatey but has never seen anime-sh — which is the only way to catch
    # the class of bug that only shows up on a clean machine.
    #
    # Runs after the release exists, because the install script downloads the
    # published executable by URL and verifies its checksum. Packing without
    # installing would only prove the XML parses.
    needs: github-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Render the package for this version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # The hash comes from the checksum published beside the binary, which
          # the bundle job generated from the binary itself. Never retyped.
          curl -fsSL -o sums.txt \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/anime-sh-$version-windows-x64.exe.sha256"
          sha=$(awk '{print $1}' sums.txt)
          echo "sha256: $sha"
          uv run python scripts/make_manifests.py "$version" --sha256 "$sha" --out dist/manifests

      - name: choco pack
        shell: pwsh
        run: choco pack dist/manifests/chocolatey/anime-sh.nuspec --outputdirectory dist/manifests/chocolatey

      - name: The package must actually install, and bring mpv with it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Local dir first for our package, community feed second so the
          # `mpvio` dependency resolves. `mpvio`, not `mpv`: the package named
          # `mpv` is titled "[Deprecated] mpv" and pinned to a 2024 build.
          choco install anime-sh --yes --no-progress `
            --source "dist/manifests/chocolatey;https://community.chocolatey.org/api/v2/"
          if ($LASTEXITCODE -ne 0) { throw "choco install failed ($LASTEXITCODE)" }

          # A package that installs is not a package that works. Assert the
          # shim runs and reports the version being released, and that the
          # declared dependency actually landed.
          $env:PATH = "$env:ALLUSERSPROFILE\chocolatey\bin;$env:PATH"
          $reported = (anime --version) | Out-String
          $reported = $reported.Trim()
          $expected = "anime-sh $($env:GITHUB_REF_NAME -replace '^v','')"
          Write-Host "shim reports: $reported"
          if ($reported -ne $expected) { throw "expected '$expected', got '$reported'" }

          $mpv = choco list --local-only --exact mpvio --limit-output
          Write-Host "mpv dependency: $mpv"
          if (-not $mpv) { throw "mpvio was not installed as a dependency" }

      - name: Attach the .nupkg to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            dist/manifests/chocolatey/*.nupkg \
            --repo "$GITHUB_REPOSITORY" --clobber
